<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TicTacToe Coverage</title>
    <!-- Fixed version, so a new Chart.js release cannot break the page -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        #current { font-size: 1.2rem; margin-bottom: 1rem; }
        table { border-collapse: collapse; margin-top: 2rem; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.4rem 0.8rem; text-align: left; }
        td.value { text-align: right; }
    </style>
</head>

<body>

<h1>Test Coverage main-Branch</h1>
<p id="current">Lade Daten...</p>

<canvas id="coverageChart"></canvas>

<table>
    <thead><tr><th>Datum</th><th>Commit</th><th>Line Coverage</th></tr></thead>
    <tbody id="historyTable"></tbody>
</table>

<script>
// The page is published from the coverage-page folder, so the CSV lies
// next to index.html (relative path, no folder prefix).
// no-store: always load the newest CSV instead of a cached one.
fetch("coverage-history.csv", { cache: "no-store" })
    .then(response => {
        if (!response.ok) {
            throw new Error("CSV not found (HTTP " + response.status + ")");
        }
        return response.text();
    })
    .then(text => {
        // Skip the header and ignore empty lines
        const rows = text.trim().split(/\r?\n/).slice(1).filter(row => row.trim() !== "");

        const labels = [];
        const coverage = [];
        const table = document.getElementById("historyTable");

        rows.forEach(row => {
            const [date, commit, value] = row.split(",");
            labels.push(date + " (" + commit + ")");
            coverage.push(Number(value));

            const tr = document.createElement("tr");
            tr.innerHTML = "<td>" + date + "</td><td>" + commit + "</td><td class='value'>" + Number(value).toFixed(2) + " %</td>";
            table.prepend(tr);
        });

        if (coverage.length === 0) {
            document.getElementById("current").textContent = "Noch keine Messwerte vorhanden.";
            return;
        }

        document.getElementById("current").textContent =
            "Aktuelle Line Coverage: " + coverage[coverage.length - 1].toFixed(2) + " %";

        new Chart(
            document.getElementById("coverageChart"),
            {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Line Coverage %",
                        data: coverage,
                        borderColor: "#2a7ae2",
                        backgroundColor: "#2a7ae2",
                        tension: 0.2
                    }]
                },
                options: {
                    scales: {
                        // Coverage is a percentage, so the axis always shows 0-100
                        y: {
                            min: 0,
                            max: 100,
                            title: { display: true, text: "Coverage (%)" }
                        },
                        x: {
                            title: { display: true, text: "Datum (Commit)" }
                        }
                    }
                }
            }
        );
    })
    .catch(error => {
        document.getElementById("current").textContent = "Fehler beim Laden: " + error.message;
    });
</script>

</body>
</html>
