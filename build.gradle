plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.assertj:assertj-core:3.26.3'
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	testImplementation 'net.jqwik:jqwik:1.9.2'
}

jacoco {
    toolVersion = "0.8.13"
}

test {
    useJUnitPlatform()

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

// Branch gate: "./gradlew build" fails if less than 90 % of all branches are covered.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// Mutation testing: "./gradlew pitest", report in build/reports/pitest/index.html
pitest {
    targetClasses = ['ch.bbw.m450.tictactoe.*']
    pitestVersion = '1.17.4'
    junit5PluginVersion = '1.2.1'
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutationThreshold = 80
}
