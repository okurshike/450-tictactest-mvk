plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

// Single source of the version. The release tag must be "v" + version (checked in docker-publish.yml).
version = '1.6.0'

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	testImplementation 'net.jqwik:jqwik:1.10.2'
}

// End-to-end tests (src/e2eTest): start the real jar as its own process and play whole games over stdin/stdout
sourceSets {
	e2eTest
}

configurations {
	e2eTestImplementation.extendsFrom testImplementation
	e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('e2eTest', Test) {
	description = 'Plays complete games against the built jar.'
	group = 'verification'
	testClassesDirs = sourceSets.e2eTest.output.classesDirs
	classpath = sourceSets.e2eTest.runtimeClasspath
	useJUnitPlatform()
	dependsOn jar
	systemProperty 'tictactoe.jar', jar.archiveFile.get().asFile.absolutePath
	shouldRunAfter test
}

// makes the jar runnable with "java -jar"
jar {
    manifest {
        attributes 'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain',
                'Implementation-Version': project.version
    }
}

jacoco {
    toolVersion = "0.8.16"
}

test {
    useJUnitPlatform()

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

// Branch gate: "./gradlew build" fails if less than 90 % of all branches are covered.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification, e2eTest

// Mutation testing: "./gradlew pitest", report in build/reports/pitest/index.html
pitest {
    targetClasses = ['ch.bbw.m450.tictactoe.*']
    pitestVersion = '1.30.1'
    junit5PluginVersion = '1.2.3'
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutationThreshold = 80
}
