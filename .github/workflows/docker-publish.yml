# Release workflow: pushing a version tag (e.g. v1.0.0) builds the dev
# container image, publishes it on GHCR with that version and creates a
# GitHub Release. See "Release- und Versionierungskonzept" in README.md.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push the image to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image gets the tag name as version, e.g. ...:v1.0.0
      - name: Build and push dev container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      # Release notes are generated from the commits since the last tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
