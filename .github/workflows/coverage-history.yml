# when on main is pushed:
# run tests in the dev container image -> generate jacoco report -> run update-coverage.py
# -> commit the changed csv to the coverage-data branch -> publish coverage page

name: Coverage History

# Only main belongs in the long-term graph. Measurements from temporary
# feature branches would make the history misleading.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read
  pages: write
  id-token: write

concurrency:
  # Do not let two pushes update the CSV at the same time. Both runs are kept
  # because every main commit should get its own measurement.
  group: coverage-history
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/devcontainer-image.yml

  # Java part runs in the dev container image (same JDK as locally and in CI)
  measure:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Generate coverage
        run: ./gradlew test jacocoTestReport

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

  # The image has no Python, so CSV and page are built on the normal runner.
  coverage:
    needs: measure
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test

      # The CSV lives on its own branch, not on main. main is protected and
      # only accepts pull requests, so the bot could not push there.
      - name: Checkout coverage data
        uses: actions/checkout@v4
        with:
          ref: coverage-data
          path: coverage-data

      # Branch coverage gets its own CSV. The old coverage-history.csv holds
      # line coverage and stays as an archive, mixing both would mislead.
      - name: Update coverage history
        run: python3 scripts/update-coverage.py coverage-data/branch-coverage-history.csv

      - name: Save coverage history
        # A runner is temporary, so the updated CSV must be committed if we
        # want to keep it. [skip ci] prevents this bot commit from starting the
        # CI workflow on the coverage-data branch.
        working-directory: coverage-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branch-coverage-history.csv
          git diff --cached --quiet || git commit -m "Update coverage history [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # The JaCoCo HTML report (with the red/green bars) becomes the start page.
      # The chart is inserted above its table: the canvas before the <h1>, the
      # scripts before </body>. This happens after the commit step, so the
      # report is only published, not committed to the repository.
      - name: Assemble site with JaCoCo report and chart
        run: |
          mkdir site
          cp -r build/reports/jacoco/test/html/. site/
          cp coverage-data/branch-coverage-history.csv coverage-page/coverage-chart.js site/
          sed -i 's|</div><h1>|</div><h2>Branch-Coverage-Verlauf main</h2><div style="max-width: 900px"><canvas id="coverageChart"></canvas></div><hr/><h1>|' site/index.html
          sed -i 's|</body>|<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script src="coverage-chart.js"></script></body>|' site/index.html
          # Fail the run if the JaCoCo HTML layout changed and sed found nothing
          grep -q coverageChart site/index.html
          grep -q coverage-chart.js site/index.html

      # Chart, CSV and JaCoCo report are published as one static website.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
