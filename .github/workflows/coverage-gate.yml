name: Coverage Gate

# when a pull request on main is opened
# or a new commit to that pr is pushed
# or when pr is reopened
# or when pr was started manually
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      # reference version
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      # pr or manually selected version, can be developed independently of main
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: branch

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x main/gradlew branch/gradlew
      # generate jacoco xml for main
      - name: Measure main coverage
        working-directory: main
        run: ./gradlew test jacocoTestReport
      # generate jacoco xml for main
      - name: Measure branch coverage
        working-directory: branch
        run: ./gradlew test jacocoTestReport

      - name: Compare coverage
        run: >-
          python3 branch/scripts/compare-coverage.py
          main/build/reports/jacoco/test/jacocoTestReport.xml
          branch/build/reports/jacoco/test/jacocoTestReport.xml
