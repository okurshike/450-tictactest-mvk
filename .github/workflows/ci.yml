name: CI

on:
  push:
      branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  # The dev container image is the single source of the build environment.
  # Its version stands only in .devcontainer/devcontainer.json; CI reads it from
  # there, so the bump PR (docker-publish.yml) changes local and CI env together.
  image:
    uses: ./.github/workflows/devcontainer-image.yml

  build:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # pull the image from GHCR

    # JDK comes from the image, so no setup-java step is needed
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # build = compile, unit tests, JaCoCo report, 90 % branch gate and the
      # end-to-end tests against the jar (check in build.gradle).
      # pitest = mutation testing. A failing test or gate turns this step red.
      - name: Build, test, branch gate and mutation testing
        run: ./gradlew build pitest

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload PIT mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-mutation-report
          path: build/reports/pitest/
