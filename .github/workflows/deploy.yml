# Deploys the artifacts of an existing GitHub Release to AWS. Nothing is built here,
# and the infrastructure is not touched (tofu apply stays manual).
# - Called by the Release workflow with only the parts that changed (see scripts/changed-parts.sh)
# - Started by hand for any published version: rollback, or rebuilding after tofu destroy/apply.
#   Then backend and frontend of that version are deployed.
name: Deploy

on:
  workflow_call:
    inputs:
      version: { type: string, required: true }   # e.g. 1.4.0
      backend: { type: boolean, required: true }
      frontend: { type: boolean, required: true }
  workflow_dispatch:
    inputs:
      version:
        description: "Published version without v, e.g. 1.3.0"
        required: true

env:
  VERSION: ${{ inputs.version }}
  # Secrets: AWS credentials from the Learner Lab (expire with every session)
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  # Variables: not secret, come from tofu output (scripts/github-aws-config.sh)
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

jobs:
  backend:
    if: github.event_name == 'workflow_dispatch' || inputs.backend
    runs-on: ubuntu-latest
    # Only one backend deployment at a time; a second one waits instead of cancelling this one
    concurrency: { group: deploy-backend, cancel-in-progress: false }
    steps:
      - name: Check AWS credentials
        run: |
          if ! aws sts get-caller-identity > /dev/null; then
            echo "::error::AWS credentials missing or expired. Start the Learner Lab, run scripts/github-aws-config.sh, then run Deploy by hand with version $VERSION."
            exit 1
          fi

      # The instance downloads the jar of this release itself (with checksum) and restarts
      # the service. Then the jar must play a whole game, otherwise the command fails.
      - name: Switch instance to ${{ env.VERSION }}
        env:
          INSTANCE: ${{ vars.INSTANCE_ID }}
        run: |
          params=$(jq -n --arg v "$VERSION" '{commands: [
            "set -e",
            "echo VERSION=\($v) > /etc/tictactest.env",
            "systemctl restart tictactest",
            "printf \"4\\n8\\n2\\n6\\n\" | timeout 60 runuser -u tictactest -- java -Xmx64m -jar /opt/tictactest/tictactoe-\($v).jar | grep -q \"winner is: CROSS\""
          ]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy $VERSION" --parameters "$params" --query Command.CommandId --output text)
          if ! aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE"; then
            aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query '[Status, StandardErrorContent]' --output text
            echo "::error::Deployment of $VERSION failed on the instance"
            exit 1
          fi

      - name: Check running version
        env:
          URL: ${{ vars.VERSION_URL }}
        run: |
          for i in $(seq 24); do
            running=$(curl -fsS --max-time 5 "$URL" || true)
            [ "$running" = "$VERSION" ] && { echo "Backend runs $VERSION"; exit 0; }
            sleep 5
          done
          echo "::error::Backend reports '$running' instead of $VERSION after 2 minutes"
          exit 1

  frontend:
    if: github.event_name == 'workflow_dispatch' || inputs.frontend
    runs-on: ubuntu-latest
    concurrency: { group: deploy-frontend, cancel-in-progress: false }
    permissions:
      contents: read   # download release assets
    steps:
      - name: Check AWS credentials
        run: |
          if ! aws sts get-caller-identity > /dev/null; then
            echo "::error::AWS credentials missing or expired. Start the Learner Lab, run scripts/github-aws-config.sh, then run Deploy by hand with version $VERSION."
            exit 1
          fi

      - name: Download frontend of release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "tictactest-frontend-$VERSION.zip"
          mkdir site && unzip -q "tictactest-frontend-$VERSION.zip" -d site

      # --delete removes files that are gone in this release. config.js comes from
      # OpenTofu (address of the instance): excluded files are neither uploaded nor deleted.
      # touch: sync skips files of the same size that are older locally, which is the case
      # in a rollback (version.txt "1.3.0" vs "1.7.0"), so make every file newer first.
      - name: Upload to S3
        run: |
          find site -type f -exec touch {} +
          aws s3 sync site "s3://${{ vars.FRONTEND_BUCKET }}" --delete --exclude config.js

      - name: Check delivered frontend
        env:
          URL: ${{ vars.FRONTEND_URL }}
        run: |
          served=$(curl -fsS "$URL/version.txt")
          [ "$served" = "$VERSION" ] || { echo "::error::Frontend serves '$served' instead of $VERSION"; exit 1; }
          curl -fsS "$URL/config.js" | grep -q consoleUrl || { echo "::error::config.js from OpenTofu is missing"; exit 1; }
          echo "Frontend serves $VERSION, config.js intact"
